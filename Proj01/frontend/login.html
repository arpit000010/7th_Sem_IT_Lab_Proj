<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Proj01 App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">Proj01 App</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="signup.html" class="btn-secondary">Create Account</a>
    </div>
  </nav>

  <main class="container">
    <div class="glass-card">
      <div class="card-header">
        <h2>Sign In</h2>
        <p>Enter your details to log in</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Password" required autocomplete="current-password">
            <button type="button" class="toggle-password">Show</button>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">
          Sign In
        </button>

        <div class="form-footer">
          Don't have an account? <a href="signup.html">Create account</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
