<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proj01 App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">Proj01 App</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="login.html" class="nav-link" id="nav-login">Sign In</a>
      <a href="signup.html" class="btn-primary" id="nav-signup">Get Started</a>
      <a href="profile.html" class="btn-secondary" id="nav-profile" style="display: none;">My Profile</a>
    </div>
  </nav>

  <main class="container">
    <section class="hero">
      <div class="glass-card wide">
        <h1>Welcome to Proj01 App</h1>
        <p>A simple web application built with Node.js and Express.</p>
        
        <div class="hero-actions">
          <a href="signup.html" class="btn-primary">Create Account</a>
          <a href="login.html" class="btn-secondary">Sign In</a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = API.getToken();
      if (token) {
        document.getElementById('nav-login').style.display = 'none';
        document.getElementById('nav-signup').style.display = 'none';
        document.getElementById('nav-profile').style.display = 'inline-flex';
      }
    });
  </script>
</body>
</html>
