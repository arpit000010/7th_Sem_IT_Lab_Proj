<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Proj01 App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">Proj01 App</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="login.html" class="btn-secondary">Sign In</a>
    </div>
  </nav>

  <main class="container">
    <div class="glass-card">
      <div class="card-header">
        <h2>Create Account</h2>
        <p>Register a new account</p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="name" class="form-control" placeholder="Name" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-control" placeholder="Email" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="signup-password" class="form-control" placeholder="Minimum 6 characters" required autocomplete="new-password">
          </div>
          <div class="password-meter">
            <div class="password-meter-fill"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">
          Register Account
        </button>

        <div class="form-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
